[pytest]
# Las suites de este repo se llaman tests_*.py (no test_*.py, que es el
# patron por defecto de pytest), asi que hay que declararlo o no colecciona
# nada.  Se conserva test_*.py por si se agregan archivos con esa forma.
python_files = tests_*.py test_*.py

# Los modulos se importan como augmented.<modulo>, asi que la raiz del repo
# tiene que estar en sys.path.
testpaths = augmented
pythonpath = .

addopts = -q --strict-markers

# Clases de dependencia del plan maestro §22.  Con --strict-markers, un marker
# no declarado es error, asi que esta lista es la definicion normativa.
markers =
    solvers: requiere un solver comercial con licencia vigente (MOSEK / Gurobi)
    rl: requiere la clase RL (gymnasium)
    viz: requiere la clase de visualizacion (graphviz / seaborn)
    slow: corrida larga; fuera de la suite base de CI
